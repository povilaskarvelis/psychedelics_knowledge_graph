[build]
  command = "bash scripts/build_site.sh"
  publish = "dist"

[[redirects]]
  from = "/ui/methods.html"
  to = "/methods/"
  status = 301

[[redirects]]
  from = "/methods.html"
  to = "/methods/"
  status = 301

[[redirects]]
  from = "/api"
  to = "/api/"
  status = 301

[[redirects]]
  from = "/agents"
  to = "/api/"
  status = 301

[[redirects]]
  from = "/developers"
  to = "/api/"
  status = 301

[[redirects]]
  from = "/developers/*"
  to = "/api/:splat"
  status = 301

[[redirects]]
  from = "/openapi.json"
  to = "https://psychedelics-kg-api.onrender.com/openapi.json"
  status = 302

[[redirects]]
  from = "/ui/"
  to = "/"
  status = 301

[[redirects]]
  from = "/ui"
  to = "/"
  status = 301

[[redirects]]
  from = "/ui/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "base-uri 'self'; frame-ancestors 'none'; object-src 'none'"
    Permissions-Policy = "camera=(), geolocation=(), microphone=()"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/api/*.md"
  [headers.values]
    Content-Type = "text/markdown; charset=utf-8"
    Cache-Control = "public, max-age=3600"
