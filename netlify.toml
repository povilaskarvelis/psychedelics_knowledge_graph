[build]
  command = "bash scripts/build_site.sh"
  publish = "dist"

[[redirects]]
  from = "/ui/"
  to = "/"
  status = 301

[[redirects]]
  from = "/ui"
  to = "/"
  status = 301

[[redirects]]
  from = "/ui/index.html"
  to = "/"
  status = 301

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
