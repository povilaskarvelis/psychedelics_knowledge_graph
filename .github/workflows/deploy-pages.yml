name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          cp -R ui site/ui
          mkdir -p site/data/curated site/data/processed
          cp data/curated/claims.json data/curated/disorder_claims.json site/data/curated/
          cp data/processed/graph_payload_mechanistic.json site/data/processed/
          cp data/processed/graph_payload_mechanistic_primary_only.json site/data/processed/
          cp data/processed/graph_payload_disorder.json site/data/processed/
          cp data/processed/graph_payload_disorder_primary_only.json site/data/processed/
          cp data/processed/graph_payload_manifest.json site/data/processed/
          cp index.html site/index.html
          touch site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
