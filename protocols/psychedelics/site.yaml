# Names, addresses, citation and presentation. Format: protocols/SPEC.md section 5.10.

name: Psychedelics Knowledge Graph
short_name: Psychedelics KG
summary: A map of psychedelic research that makes findings easier to explore, audit and keep up to date.

addresses:
  site: https://psychedelicskg.com/
  data_host: https://data.psychedelicskg.com/
  api_base: https://psychedelics-kg-api.onrender.com/api/v1
  mcp: https://psychedelics-kg-api.onrender.com/mcp
  repository: https://github.com/povilaskarvelis/psychedelics_knowledge_graph

citation:
  file: CITATION.cff
  release_metadata: release-metadata.json
  version_doi: 10.5281/zenodo.22837501
  concept_doi: 10.5281/zenodo.21671975
  authors: [{name: Povilas Karvelis, orcid: 0000-0001-7469-5624}]

licences:
  code: Apache-2.0
  project_data: CC0-1.0
  third_party_content: retains original rights (reports, abstracts, figures, tables, provider data)

identifiers_in_services:                    # field name embedded in service contracts; derive from protocol id
  mcp_resource_scheme: psychedelics-kg://
  schema_version_prefix: psychedelics_kg_
  graph_view_contract_version: psychedelics_kg_graph_view_contract_v1

presentation:                               # ui/styles.css :root
  background: '#080a0b'
  foreground: '#e8ece8'
  accent: ['#f1b74b', '#49d6c8', '#ef6c9a']
  fonts: {headings: Space Grotesk, body: IBM Plex Sans}

pages_with_field_text:                      # lines mentioning the field or the anchor type (measured 2026-10-30)
  index.html: 29
  about/index.html: 20
  methods/index.html: 72
  compounds/psilocybin/index.html: 1127    # generated by scripts/build_compound_pages.py
  api/index.html: 25
  api/agent-guide.md: 18
  llms.txt: 14
  feedback/index.html: 12
  CITATION.cff: 6
