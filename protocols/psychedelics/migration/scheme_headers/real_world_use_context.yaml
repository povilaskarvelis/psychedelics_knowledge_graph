scheme: real_world_use_context
title: Real-world use contexts
protocol: psychedelics
status: worked_example
reuse: field
attaches_to: finding
note: These labels tag findings in the real-world and public-health domain; they are not graph nodes.
used_by_domains: [real_world_public_health]
external_ids:
  scheme: not_applicable
matching:
  implemented_in: pipeline/kg/build_evidence_tables.py real_world_use_context (read 2026-10-30)
  key_normalization: ASCII-fold, lowercase, '&' to 'and', non-alphanumeric characters to single spaces (label_key)
  tags:
    description: Assigns zero or more labels to a finding (multi-label).
    steps:
      - {use: concept_labels, compare: exact_key, input: "real_world_use_context, split on semicolons, commas and vertical bars"}
      - {use: patterns, order: declared, stop_at: never, fields: context_fields}
      - {use: legacy_keys, fields: [public_health_graph_label, public_health_topic_category]}
    constraints:
      - {label: Self-treatment, from_step: legacy_keys, suppressed_if_present: Clinical care}
  field_groups:
    context_fields: [real_world_use_context, compound, compound_original, compound_or_exposure, public_health_measure,
                     exposure_or_policy, exposure_or_intervention, population, population_or_setting, setting, study_design,
                     data_source_or_study_design, finding_summary, study_title, support, supporting_quote]
